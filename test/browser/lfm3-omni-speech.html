<!doctype html>
<meta charset="utf-8">
<title>LFM3-Omni speech out vs onnxruntime CPU</title>
<pre id="out">running</pre>
<script type="module">
// Speech-out gate for engines/lfm3_omni.js on WebGPU, against scripts/lfm3-omni-speech-ref.py (Liquid's runner on
// onnxruntime's CPU EP). The s2s case (the fixture's speech clip in; interleaved text and speech out) runs with the
// reference's MaskGIT orders replayed and greedy speech codes (audio_temperature 0, repetition penalty 1.2 over 64
// frames), for the reference's slot count. Passes when every slot (text tokens and frames), every frame's 12 codes,
// and the decoded wave (length; RMS and sum within 1e-3 relative) match. A second run samples speech as the product
// does (generation_config.json: temperature 0.4), streams it, and must stop when aborted from onAudio. Both waves
// are offered as WAV files: run-demo --wav writes them.
//   node examples/run-demo.mjs test/browser/lfm3-omni-speech.html --models /Volumes/Models2/Models/lfm3/omni-2b-onnx --wav /tmp/lfm3-omni
// Query: ?base=/models/, &ort=1.30.0, &transformers=4.3.2. The model's Cache Storage entries are deleted at the end.
import { Lfm3Omni } from '../../engines/lfm3_omni.js';
const q = new URLSearchParams(location.search);
const base = new URL(q.get('base') || '/models/', location.href).href;
const ortVersion = q.get('ort') || '1.30.0', tfVersion = q.get('transformers') || '4.3.2';
const log = (s) => { const t = typeof s === 'string' ? s : JSON.stringify(s); document.getElementById('out').textContent += `\n${t}`; window.progressText = t; };
// 16-bit mono WAV, peak-normalised to 0.9 as lfm2_audio.infer.write_wav does
function wav(pcm, rate) {
  let peak = 0; for (const x of pcm) peak = Math.max(peak, Math.abs(x));
  const g = peak > 0 ? 0.9 / peak : 1, buf = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) buf.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); buf.setUint32(4, 36 + pcm.length * 2, true); str(8, 'WAVEfmt '); buf.setUint32(16, 16, true); buf.setUint16(20, 1, true);
  buf.setUint16(22, 1, true); buf.setUint32(24, rate, true); buf.setUint32(28, rate * 2, true); buf.setUint16(32, 2, true); buf.setUint16(34, 16, true);
  str(36, 'data'); buf.setUint32(40, pcm.length * 2, true);
  pcm.forEach((x, i) => buf.setInt16(44 + 2 * i, Math.max(-32768, Math.min(32767, Math.round(x * g * 32767))), true));
  let s = ''; const b = new Uint8Array(buf.buffer); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
  return btoa(s);
}
const stats = (a) => { let s = 0, s2 = 0, p = 0; for (const x of a) { s += x; s2 += x * x; p = Math.max(p, Math.abs(x)); } return { samples: a.length, rms: a.length ? Math.sqrt(s2 / a.length) : 0, sum: s, peak: p }; };
try {
  await Lfm3Omni.deleteCache({ baseUrl: base });
  const refDir = new URL('../refs/lfm3-omni/', import.meta.url);
  const so = await (await fetch(new URL('speech-out.json', refDir), { cache: 'no-store' })).json();
  const fx = await (await fetch(new URL('fixture.json', refDir), { cache: 'no-store' })).json();
  const pcm = await (await fetch(new URL(fx.speech.file, refDir), { cache: 'no-store' })).arrayBuffer();
  const clip = Float32Array.from(new Int16Array(pcm), (x) => x / 32768);
  const ort = await import(`https://cdn.jsdelivr.net/npm/onnxruntime-web@${ortVersion}/dist/ort.webgpu.min.mjs`);
  const transformers = await import(`https://cdn.jsdelivr.net/npm/@huggingface/transformers@${tfVersion}/+esm`);
  const t0 = performance.now();
  const m = await Lfm3Omni.load({ baseUrl: base, ort, transformers, speech: true,
    onProgress: (e) => log(e.total ? `${e.status} ${e.file} ${(e.loaded / 2 ** 20).toFixed(0)} of ${(e.total / 2 ** 20).toFixed(0)} MiB` : `${e.status} ${e.file || ''}`) });
  log(`loaded in ${((performance.now() - t0) / 1000).toFixed(1)} s, onnxruntime-web ${ortVersion}`);
  const messages = [{ role: 'user', content: [{ type: 'audio', audio: clip }] }];

  // 1. the reference replay
  const chunks = [];
  const t1 = performance.now();
  const r = await m.generate(messages, { output_modalities: ['text', 'audio'], max_new_tokens: so.slots, audio_temperature: 0,
    audio_repetition_penalty: so.audio_sampling.repetition_penalty, audio_repetition_window: so.audio_sampling.repetition_window, orders: so.orders,
    onAudio: (a) => chunks.push({ samples: a.length, at: Math.round(performance.now() - t1) }) });
  const seconds = (performance.now() - t1) / 1000;
  const slotDiv = so.tokens.findIndex((t, i) => r.tokens[i] !== t);
  const frameDiv = so.frames.findIndex((f, i) => !r.audio_codes[i] || f.some((c, k) => r.audio_codes[i][k] !== c));
  const ours = stats(r.audio), rel = (a, b) => Math.abs(a - b) / Math.max(Math.abs(b), 1e-9);
  const replay = { slots: r.tokens.length, refSlots: so.tokens.length, firstSlotDivergence: slotDiv, frames: r.audio_codes.length, refFrames: so.frames.length,
    firstFrameDivergence: frameDiv, text: r.text, refText: so.text, wave: ours, refWave: { samples: so.wave.samples, rms: so.wave.rms, sum: so.wave.sum, peak: so.wave.peak },
    seconds: +seconds.toFixed(1), audioSeconds: +(r.audio.length / r.sampling_rate).toFixed(2), firstAudioMs: chunks[0]?.at, chunks };
  replay.ok = slotDiv < 0 && r.tokens.length === so.tokens.length && frameDiv < 0 && r.audio_codes.length === so.frames.length
    && ours.samples === so.wave.samples && rel(ours.rms, so.wave.rms) <= 1e-3 && rel(ours.sum, so.wave.sum) <= 1e-3;
  log({ replay });

  // 2. sampled speech as the product runs it, then an abort from onAudio
  const t2 = performance.now();
  const s = await m.generate(messages, { output_modalities: ['text', 'audio'], max_new_tokens: 400, seed: 1 });
  const sampled = { stopReason: s.stopReason, text: s.text, frames: s.audio_codes.length, audioSeconds: +(s.audio.length / 24000).toFixed(2), seconds: +((performance.now() - t2) / 1000).toFixed(1), wave: stats(s.audio) };
  log({ sampled });
  const ac = new AbortController();
  const a = await m.generate(messages, { output_modalities: ['text', 'audio'], max_new_tokens: 400, seed: 2, signal: ac.signal, onAudio: () => ac.abort() });
  const abort = { stopReason: a.stopReason, frames: a.audio_codes.length, ok: a.stopReason === 'aborted' && a.audio_codes.length <= 13 };
  log({ abort });
  // text-only stays as it was: the layer-1 text case
  const c0 = fx.cases[0], t = await m.generate(c0.messages, { max_new_tokens: c0.gen.length });
  const textOnly = { text: t.text, refText: c0.text.replace('<|im_end|>', ''), ok: t.text === c0.text.replace('<|im_end|>', '') };
  log({ textOnly });
  await m.dispose();
  window.wavs = { replay: wav(r.audio, r.sampling_rate), sampled: wav(s.audio, s.sampling_rate) };
  await Lfm3Omni.deleteCache({ baseUrl: base });
  window.result = { ok: replay.ok && abort.ok && textOnly.ok && s.audio.length > 0, ort: ortVersion, replay, sampled, abort, textOnly };
} catch (e) { window.result = { ok: false, error: `${e.code || e.name}: ${e.message}`, stack: e.stack }; }
log(window.result);
</script>
