<!doctype html>
<meta charset="utf-8">
<title>text gate vs llama.cpp</title>
<pre id="out">running</pre>
<script type="module">
// Text gate for a native engine: its greedy continuation of each stored prompt in a chat refs file
// (examples/chat/refs/*.json, written by scripts/record-refs.mjs --raw) against llama.cpp's reply, character for character.
//   node examples/run-demo.mjs test/browser/text-gate.html --models <dir> --file <gguf> --ref examples/chat/refs/<x>.json [--engine lfm2]
// ?poolGB sets the expert pool (default 4). The store goes under OPFS diskformer-test/<file> and stays for the next run.
// Run-time LoRA: --query "adapter=/models/<lora.gguf>&ref2=/examples/chat/refs/<y>.json" runs three phases on one
// loaded engine: the plain model against ref, the adapter switched on against ref2, then switched off against ref again.
import { Lfm2MoeSsd } from '../../engines/lfm2_moe_ssd.js';
import { Gemma4MoeSsd } from '../../engines/gemma4_moe_ssd.js';
import { Qwen35MoeSsd } from '../../engines/qwen35_moe_ssd.js';
import { storeKey } from '../../src/ingest.js';
const ENGINES = { lfm2: Lfm2MoeSsd, gemma: Gemma4MoeSsd, qwen35: Qwen35MoeSsd };
const q = new URLSearchParams(location.search);
const url = q.get('url'), Engine = ENGINES[q.get('engine') || 'lfm2'];
const log = (s) => { document.getElementById('out').textContent += `\n${s}`; window.progressText = s; };
const refs = async (u) => (await fetch(u, { cache: 'no-store' })).json();

async function phase(m, name, ref) {
  const stops = new Set(m.stopTokenIds), rows = [];
  for (const c of ref.conversations) {
    const s0 = performance.now();
    // llama-server's /completion adds BOS when the GGUF asks for it (m.addBos); the stored prompt (from
    // /apply-template) leaves it out. ?bos=0 never adds it.
    const ids = m.tokenizer.encode(c.prompt);
    if (q.get('bos') !== '0' && m.addBos && m.cfg.bos !== undefined && ids[0] !== m.cfg.bos) ids.unshift(m.cfg.bos);
    const g = await m.greedy(ids, c.tokens, { top: 1 });
    // llama-server stops at an end-of-generation token and leaves it out of the reply
    const end = g.ids.findIndex((id) => stops.has(id)), out = end < 0 ? g.ids : g.ids.slice(0, end);
    const ours = m.tokenizer.decode(out), theirs = c.content;
    let at = 0; while (at < ours.length && at < theirs.length && ours[at] === theirs[at]) at++;
    const row = { name: c.name, identical: ours === theirs, sameUpTo: at, of: theirs.length, tokPerSec: +(out.length / ((performance.now() - s0) / 1000)).toFixed(1), ...(ours === theirs ? {} : { ours, theirs }) };
    rows.push(row);
    log(`${name}: ${row.identical ? 'OK  ' : 'DIFF'} ${c.name} ${row.identical ? '' : `first difference at char ${at} of ${theirs.length}`}`);
  }
  const identical = rows.filter((r) => r.identical).length;
  log(`${name}: ${identical}/${rows.length} identical to the reference`);
  return { phase: name, identical, of: rows.length, about: ref.about, rows };
}

try {
  const ref = await refs(q.get('ref'));
  const t0 = performance.now();
  const m = await Engine.load(null, { url, key: storeKey(url.split('/').pop()), root: 'diskformer-test', poolBytes: Number(q.get('poolGB') || 4) * 2 ** 30, maxCtx: 512,
    onProgress: (e) => { if (e.status === 'weights' && e.total) log(`load ${e.kind || 'ingest'} ${e.loaded} of ${e.total}`); } });
  log(`loaded in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  const phases = [await phase(m, 'plain', ref)];
  let adapter = null;
  if (q.get('adapter')) {
    const t1 = performance.now();
    adapter = await m.loadAdapter(q.get('adapter'));
    log(`adapter ${adapter.name}: rank ${adapter.rank}, scale ${adapter.scale}, ${adapter.matrices} matrices, ${(adapter.bytes / 1e6).toFixed(1)} MB on the GPU, in ${((performance.now() - t1) / 1000).toFixed(1)} s`);
    await m.setAdapter(adapter);
    phases.push(await phase(m, 'adapter', await refs(q.get('ref2'))));
    await m.setAdapter(null);
    phases.push(await phase(m, 'plain again', ref));
  }
  const identical = phases.reduce((x, p) => x + p.identical, 0), of = phases.reduce((x, p) => x + p.of, 0);
  window.result = { ok: identical === of, identical, of, adapter: adapter && { name: adapter.name, rank: adapter.rank, scale: adapter.scale, matrices: adapter.matrices, bytes: adapter.bytes }, phases };
  await m.dispose();
} catch (e) { window.result = { ok: false, error: `${e.code || e.name}: ${e.message}`, stack: e.stack }; log(window.result.error); }
</script>
