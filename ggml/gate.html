<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diskformer · paged gate</title>
<style>
  :root { --bg: #fafaf8; --fg: #1c1c1a; --muted: #6b6b66; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #e8e8e3; --muted: #9a9a93; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-monospace, monospace; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px; } pre { white-space: pre-wrap; }
</style>
<main><pre id="out">gate: ?model=&lt;GGUF name in OPFS&gt;&amp;refs=&lt;json&gt;&amp;slots=N [&amp;url=&lt;GGUF URL&gt;&amp;size=&lt;bytes&gt;: copy it into OPFS first]</pre></main>
<script type="module">
  // Replays llama.cpp's replies (examples/chat/refs/*.json) through llama.cpp + WebGPU_Paged in this tab.
  const q = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  const say = (l) => { out.textContent += '\n' + l; };
  const expected = (prompt, content) => {
    for (let k = Math.min(prompt.length, content.length); k > 0; k--) if (prompt.endsWith(content.slice(0, k))) return content.slice(k);
    return content;
  };
  const refs = await (await fetch(q.get('refs'))).json();
  const worker = new Worker(`./worker.mjs?${Date.now()}`, { type: 'module' });
  window.gateLog = [];
  const next = () => new Promise((resolve, reject) => {
    worker.onmessage = ({ data }) => {
      if (data.type === 'log') console.log(data.line);   // the driver's log, in Chrome's log with chrome-gate --log
      if (data.type === 'log' && /ggml_webgpu paged/.test(data.line)) window.gateLog.push(data.line);
      if (data.type === 'error') reject(new Error(data.message));
      else if (data.type === 'loaded' || data.type === 'done' || data.type === 'downloaded') resolve(data);
    };
  });
  out.textContent = `model ${q.get('model')} · ${q.get('budget') ? `budget ${q.get('budget')} GB` : `slots ${q.get('slots')}`}`;
  // env=NAME=value,NAME=value: settings for llama.cpp / ggml-webgpu
  const env = Object.fromEntries((q.get('env') || '').split(',').filter(Boolean).map((kv) => kv.split('=')));
  out.textContent += env && Object.keys(env).length ? ` · ${q.get('env')}` : '';
  // a failed step ends the gate with an error instead of leaving it waiting (scripts/chrome-gate.mjs reads window.gate)
  window.onunhandledrejection = (e) => { say(`error: ${e.reason && e.reason.message}`); window.gate = { error: String(e.reason && e.reason.message) }; };
  // url / size: the GGUF to copy into OPFS first; comma-separated for each part of a split GGUF, named as in the URL
  if (q.get('url')) {
    const urls = q.get('url').split(','), sizes = q.get('size').split(',').map(Number);
    for (let k = 0; k < urls.length; k++) {
      worker.postMessage({ type: 'download', url: urls[k], name: urls.length > 1 ? urls[k].split('/').pop() : q.get('model'), size: sizes[k] });
      const d = await next();
      say(`${urls.length > 1 ? `part ${k + 1} of ${urls.length} ` : ''}in OPFS (${d.ms ? `copied in ${(d.ms / 1000).toFixed(1)} s` : 'already there'})`);
    }
  }
  // draft_url / draft_size: a drafter GGUF for speculative decoding, copied into OPFS under its URL's name
  const draft = q.get('draft_url') ? q.get('draft_url').split('/').pop() : null;
  if (draft) {
    worker.postMessage({ type: 'download', url: q.get('draft_url'), name: draft, size: +q.get('draft_size') });
    const d = await next();
    say(`drafter ${draft} in OPFS (${d.ms ? `copied in ${(d.ms / 1000).toFixed(1)} s` : 'already there'})`);
  }
  // lora_url / lora_size: a LoRA adapter GGUF, copied into OPFS the same way; lora_scale (default 1)
  const lora = q.get('lora_url') ? q.get('lora_url').split('/').pop() : null;
  if (lora) {
    worker.postMessage({ type: 'download', url: q.get('lora_url'), name: lora, size: +q.get('lora_size') });
    const d = await next();
    say(`adapter ${lora} in OPFS (${d.ms ? `copied in ${(d.ms / 1000).toFixed(1)} s` : 'already there'})`);
  }
  // extra_url / extra_size (comma-separated): side files the model opens beside the GGUF, copied into OPFS the same way
  const extra = q.get('extra_url') ? q.get('extra_url').split(',').map((u) => u.split('/').pop()) : [];
  for (const [k, u] of (q.get('extra_url') ? q.get('extra_url').split(',') : []).entries()) {
    worker.postMessage({ type: 'download', url: u, name: extra[k], size: +q.get('extra_size').split(',')[k] });
    const d = await next();
    say(`${extra[k]} in OPFS (${d.ms ? `copied in ${(d.ms / 1000).toFixed(1)} s` : 'already there'})`);
  }
  // budget=<GB> plans the slots from a GPU budget; slots=<n> sets them directly
  worker.postMessage({ type: 'load', opfsName: q.get('model'), slots: +q.get('slots'), budget: q.get('budget') ? +q.get('budget') * 1e9 : 0, env, draft, lora, loraScale: q.get('lora_scale') ? +q.get('lora_scale') : 1, extra });
  const loaded = await next();
  say(`loaded in ${(loaded.ms / 1000).toFixed(1)} s (rc ${loaded.rc}), ${loaded.slots} slots`);
  const results = [];
  const only = q.get('only');
  for (const c of refs.conversations.filter((c) => !only || only.split(',').includes(c.name))) {
    const want = expected(c.prompt, c.content);
    worker.postMessage({ type: 'complete', prompt: c.prompt, n: c.tokens });
    const r = await next();
    let at = 0;
    while (at < r.text.length && r.text[at] === want[at]) at++;
    const ok = r.text === want;
    const tps = r.stats.decode_tokens / (r.stats.decode_ms / 1000);
    results.push({ name: c.name, ok, text: r.text, stats: r.stats });
    const acc = r.stats.drafted ? `  accepted ${r.stats.accepted}/${r.stats.drafted}` : '';
    say(`${ok ? 'OK  ' : 'DIFF'} ${c.name.padEnd(22)} ${tps.toFixed(2)} tok/s${acc}${ok ? '' : `  first difference at char ${at} of ${want.length}`}`);
  }
  const same = results.filter((r) => r.ok).length;
  say(`${same}/${results.length} identical to the reference`);
  window.gate = { same, total: results.length, results };
</script>
</html>
